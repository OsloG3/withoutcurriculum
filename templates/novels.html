<!doctype html>
<html lang="en">
    <head>
        {{template "head"}}
    </head>
    <body>
        {{template "header.html"}}
        <section class="page" id="novels">
            <h2 class="page-title">
                <span class="orn">{{template "flower"}}</span> Novels
                <span class="orn">{{template "flower"}}</span>
            </h2>
            <div class="book-grid">
                <div class="book-stack">
                    <a href="/?category=novels&text=comedia_ita.html"
                        ><img
                            src="/static/media/sogni-inabissati.png"
                            alt="Sogni inabissati"
                            loading="lazy"
                    /></a>
                    <a href="/?category=novels&text=comedia_spa.html"
                        ><img
                            src="/static/media/comediai_spa.jpeg"
                            alt="Comedia - español"
                            loading="lazy"
                    /></a>
                    <a href="/?category=novels&text=comedia_rus.html"
                        ><img
                            src="/static/media/CommediaRUS.png"
                            alt="Комедия - русский"
                            loading="lazy"
                    /></a>
                    <a href="/static/novels/O_catalogo_dos_sonhos.pdf"
                        ><img
                            src="/static/media/commediaPORT.png"
                            alt="O catálogo dos sonhos - português"
                            loading="lazy"
                    /></a>
                </div>
                <div class="book-stack">
                    <a
                        href="/?category=novels&text=i_cerchi_della_solitudine.html"
                        ><img
                            src="/static/media/cerchi.jpg"
                            alt="I cerchi della solitudine"
                            loading="lazy"
                    /></a>
                    <a href="/?category=novels&text=los_circulos.html"
                        ><img
                            src="/static/media/spa_cerchi.png"
                            alt="Los círculos de la soledad"
                            loading="lazy"
                    /></a>
                    <a
                        href="/?category=novels&text=i_cerchi_della_solitudine_rus.html"
                        ><img
                            src="/static/media/rus1.png"
                            alt="Круги одиночества"
                            loading="lazy"
                    /></a>
                </div>
                <div class="book-stack">
                    <a href="/?category=novels&text=gli_eletti.html"
                        ><img
                            src="/static/media/gli-eletti.png"
                            alt="Gli eletti"
                            loading="lazy"
                    /></a>
                </div>
            </div>
        </section>
        {{template "sitefooter"}}
    </body>
</html>
