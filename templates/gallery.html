<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>without curriculum</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="gallery-body">
    {{template "header.html"}}
		<div class="gallery">
			{{range .Images}}
				<a href="#lightbox" onclick="showImage('{{.}}')">
					<img src="{{.}}" alt="">
				</a>
			{{end}}
		</div>

	<div id="lightbox">
		<button class="lb-btn" id="lb-close" onclick="closeLightbox()">&#10005;</button>
		<button class="lb-btn" id="lb-prev" onclick="navImage(-1)">&#10094;</button>
		<img id="lightbox-img" src="">
		<button class="lb-btn" id="lb-next" onclick="navImage(1)">&#10095;</button>
	</div>

		<script>
			var images = [];
			var currentIdx = 0;

			{{range .Images}}
			images.push('{{.}}');
			{{end}}

			function showImage(src) {
				currentIdx = images.indexOf(src);
				var lb = document.getElementById("lightbox");
				var img = document.getElementById("lightbox-img");
				img.src = src;
				lb.style.display = "flex";
			}

			function closeLightbox() {
				document.getElementById("lightbox").style.display = "none";
			}

			function navImage(dir) {
				currentIdx = (currentIdx + dir + images.length) % images.length;
				document.getElementById("lightbox-img").src = images[currentIdx];
			}

			document.getElementById("lightbox").addEventListener("click", function(e) {
				if (e.target === this) closeLightbox();
			});

			document.addEventListener("keydown", function(e) {
				var lb = document.getElementById("lightbox");
				if (lb.style.display !== "flex") return;
				if (e.key === "Escape") closeLightbox();
				if (e.key === "ArrowLeft") navImage(-1);
				if (e.key === "ArrowRight") navImage(1);
			});
		</script>
</body>
</html>
